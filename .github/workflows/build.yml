name: Build ZBOT-MOBILE

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ZBOT_GITHUB_PAT }}
          submodules: 'recursive'

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          cli: "latest"
          sdk: "nightly"

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: ['package']
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ZBOT_GITHUB_PAT }}

      - name: Leer version del mod desde mod.json
        id: modver
        run: |
          set -e
          ver=$(jq -r .version mod.json)
          if [[ -z "$ver" || "$ver" == "null" ]]; then
            echo "::error::No se encontro version en mod.json"
            exit 1
          fi
          # normalize to vX.Y.Z
          if [[ "$ver" != v* ]]; then
            ver="v$ver"
          fi
          if [[ ! "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$ver' en mod.json no tiene formato vX.Y.Z"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Publicando version $ver"

      - name: Extraer seccion del changelog para esta version
        id: changelog
        run: |
          set -e
          ver="${{ steps.modver.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "No hay CHANGELOG.md, saltando extraccion."
            echo "body=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Extraemos las lineas desde "## $ver" hasta el siguiente heading "## ".
          section=$(awk -v ver="$ver" '
            $0 ~ "^## "ver"( |$)" {flag=1; next}
            flag && /^## / {flag=0}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$section" ]; then
            echo "No se encontro seccion de CHANGELOG para $ver."
            echo "body=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$section"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Descargar artefacto de build
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: ./release-files

      - name: Listar archivos descargados
        run: ls -la ./release-files

      - name: Verificar que existen archivos .geode
        run: |
          set -e
          if ! ls ./release-files/*.geode 1> /dev/null 2>&1; then
            echo "::error::No se encontraron archivos .geode en el build"
            exit 1
          fi
          echo "Archivos .geode listos para publicar:"
          ls -la ./release-files/*.geode

      # Borramos el release anterior con el mismo tag para poder
      # republicar sin errores de assets duplicados (ej: rerun del workflow).
      - name: Borrar release anterior con el mismo tag (si existe)
        env:
          GH_TOKEN: ${{ secrets.ZBOT_GITHUB_PAT }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.modver.outputs.version }}
        run: |
          set -e
          echo "Buscando release existente con tag '$TAG'..."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Borrando release $TAG..."
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          else
            echo "No existe release previo para $TAG."
          fi

      - name: Publish ${{ steps.modver.outputs.version }} GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.modver.outputs.version }}
          name: ZBOT-MOBILE ${{ steps.modver.outputs.version }}
          body: |
            Build Android de ZBOT-MOBILE ${{ steps.modver.outputs.version }}.

            ${{ steps.changelog.outputs.body }}

            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Mensaje:** ${{ github.event.head_commit.message }}

            ### Instalacion
            Descarga el archivo `.geode` y copialo a:
            `/storage/emulated/0/Android/media/com.geode.launcher/game/geode/mods/`

            Los macros se guardan en:
            `/storage/emulated/0/Android/media/com.geode.launcher/game/geode/macros/`
          files: ./release-files/*.geode
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.ZBOT_GITHUB_PAT }}
